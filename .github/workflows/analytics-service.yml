name: Analytics and Moodle Sync

on:
  # En las pull requests se ejecuta siempre, para que el check aparezca y se pueda confirmar antes de aprobar.
  pull_request:
    branches: [main, develop]
  push:
    branches: [develop, main]
    paths:
      - 'services/analytics-service/**'
      - 'services/moodle-sync-service/**'
      - 'database/seed/**'
      - '.github/workflows/analytics-service.yml'

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore Analytics
        run: dotnet restore services/analytics-service/AnalyticsService.Tests/AnalyticsService.Tests.csproj

      - name: Build Analytics
        run: dotnet build services/analytics-service/AnalyticsService.Tests/AnalyticsService.Tests.csproj --configuration Release --no-restore

      - name: Test Analytics
        run: dotnet test services/analytics-service/AnalyticsService.Tests/AnalyticsService.Tests.csproj --configuration Release --no-build --verbosity normal

      - name: Restore Moodle Sync
        run: dotnet restore services/moodle-sync-service/tests/MoodleSync.Tests/MoodleSync.Tests.csproj

      - name: Build Moodle Sync
        run: dotnet build services/moodle-sync-service/tests/MoodleSync.Tests/MoodleSync.Tests.csproj --configuration Release --no-restore

      - name: Test Moodle Sync
        run: dotnet test services/moodle-sync-service/tests/MoodleSync.Tests/MoodleSync.Tests.csproj --configuration Release --no-build --verbosity normal
