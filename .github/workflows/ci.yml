name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

jobs:
  verificar-repo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verificar que no hay secretos versionados
        run: |
          if git ls-files | grep -E '(^|/)\.env$'; then
            echo "Hay un .env versionado"; exit 1
          fi

  web-ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/web-ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: services/web-ui/package-lock.json
      - name: Instalar dependencias
        run: npm ci
      - name: Ejecutar lint
        run: npm run lint
      - name: Compilar interfaz
        run: npm run build
      - name: Ejecutar pruebas si existen
        run: npm run test --if-present
