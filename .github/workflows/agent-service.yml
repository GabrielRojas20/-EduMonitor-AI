name: Agent Service

# Pruebas del agente (Python) y del evaluador de escenarios. Se ejecutan en toda pull request,
# para que el check aparezca siempre y se pueda confirmar antes de aprobar.
on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [develop, main]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/agent-service
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: services/agent-service/requirements-dev.txt

      - name: Instalar dependencias
        run: pip install -r requirements-dev.txt

      - name: Pruebas del agente con cobertura (mínimo 70 %, RNF-08)
        run: python -m pytest -q --cov=app --cov-report=term --cov-fail-under=70

      - name: Pruebas del evaluador de escenarios
        working-directory: evaluation/agent-scenarios
        run: python -m unittest -v test_ejecutar
