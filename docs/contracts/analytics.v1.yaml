openapi: 3.0.3
info:
  title: EduMonitor AI - analytics-service
  version: 1.0.0
  description: |-
    Contrato v1 del servicio de indicadores y alertas. El servicio es interno;
    la interfaz y el agente lo consumen a través del api-gateway.

    Analytics calcula de forma determinista sobre la última sincronización
    exitosa de Moodle. No recibe ni persiste onlinetext. score null nunca se
    convierte en 0. La escala funcional del MVP es 0 a 10.

    Autorización: recibe el JWT reenviado por el api-gateway. El gateway valida
    la firma, expiración y acceso del docente al curso antes de invocar este
    servicio; analytics vuelve a rechazar tokens ausentes o inválidos. El
    servicio no publica un puerto fuera de la red interna en el despliegue.

    Si snapshotId se omite, todas las operaciones consultan la última
    sincronización exitosa. El MVP no expone un catálogo de snapshots.
servers:
- url: http://localhost:5003
  description: Local (alinear puerto con docker-compose)
tags:
- name: indicators
  description: Indicadores deterministas de curso y estudiante.
- name: alerts
  description: Alertas configurables y explicables.
- name: reports
  description: Datos calculados para el informe del curso.
security:
- bearerAuth: []
paths:
  /api/v1/courses/{courseId}/analytics:
    get:
      operationId: getCourseAnalytics
      tags:
      - indicators
      summary: Obtener indicadores calculados del curso
      parameters:
      - $ref: '#/components/parameters/courseId'
      - $ref: '#/components/parameters/requestId'
      - $ref: '#/components/parameters/snapshotId'
      responses:
        '200':
          description: Indicadores del curso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CourseAnalytics'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/Unavailable'
  /api/v1/courses/{courseId}/analytics/students/{studentId}:
    get:
      operationId: getStudentAnalytics
      tags:
      - indicators
      summary: Obtener indicadores de un estudiante del curso
      parameters:
      - $ref: '#/components/parameters/courseId'
      - $ref: '#/components/parameters/studentId'
      - $ref: '#/components/parameters/requestId'
      - $ref: '#/components/parameters/snapshotId'
      responses:
        '200':
          description: Indicadores del estudiante
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudentAnalytics'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/Unavailable'
  /api/v1/courses/{courseId}/analytics/alerts:
    get:
      operationId: listCourseAlerts
      tags:
      - alerts
      summary: Listar alertas explicables del curso
      parameters:
      - $ref: '#/components/parameters/courseId'
      - $ref: '#/components/parameters/requestId'
      - $ref: '#/components/parameters/snapshotId'
      - $ref: '#/components/parameters/studentIdQuery'
      - $ref: '#/components/parameters/severity'
      - $ref: '#/components/parameters/alertStatus'
      - $ref: '#/components/parameters/page'
      - $ref: '#/components/parameters/pageSize'
      responses:
        '200':
          description: Alertas del curso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageOfAlerts'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/Unavailable'
  /api/v1/courses/{courseId}/analytics/report:
    get:
      operationId: getCourseReportData
      tags:
      - reports
      summary: Obtener datos calculados para el informe del curso
      description: Devuelve hechos calculados y hallazgos; el agent-service redacta el informe y no recalcula indicadores.
      parameters:
      - $ref: '#/components/parameters/courseId'
      - $ref: '#/components/parameters/requestId'
      - $ref: '#/components/parameters/snapshotId'
      responses:
        '200':
          description: Datos del informe
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CourseReportData'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/Unavailable'
components:
  schemas:
    Metric:
      type: object
      required:
      - value
      - unit
      - status
      properties:
        value:
          type: number
          nullable: true
        unit:
          type: string
          enum: [score_0_10, percent, count]
        status:
          type: string
          enum: [available, partial, unavailable]
        code:
          type: string
          nullable: true
          enum: [DATA_NOT_AVAILABLE]
        detail:
          type: string
          nullable: true
        numerator:
          type: integer
          nullable: true
        denominator:
          type: integer
          nullable: true
    Counts:
      type: object
      required:
      - gradedCount
      - pendingGradingCount
      - notSubmittedCount
      properties:
        gradedCount:
          type: integer
          minimum: 0
        pendingGradingCount:
          type: integer
          minimum: 0
        notSubmittedCount:
          type: integer
          minimum: 0
        draftCount:
          type: integer
          minimum: 0
          description: Subconjunto de notSubmittedCount correspondiente a borradores sin enviar. No se suma otra vez.
    SnapshotMeta:
      type: object
      required:
      - snapshotId
      - calculatedAt
      - dataQuality
      properties:
        snapshotId:
          type: string
        syncId:
          type: string
          nullable: true
        calculatedAt:
          type: string
          format: date-time
        dataQuality:
          type: string
          enum: [complete, partial, unavailable]
    CourseAnalytics:
      type: object
      required:
      - courseId
      - snapshot
      - averageScore10
      - submissionRate
      - gradingRate
      - completionRate
      - pendingGradingRate
      - counts
      properties:
        courseId:
          type: integer
        snapshot:
          $ref: '#/components/schemas/SnapshotMeta'
        averageScore10:
          $ref: '#/components/schemas/Metric'
        submissionRate:
          $ref: '#/components/schemas/Metric'
        gradingRate:
          $ref: '#/components/schemas/Metric'
        completionRate:
          $ref: '#/components/schemas/Metric'
        pendingGradingRate:
          $ref: '#/components/schemas/Metric'
        counts:
          $ref: '#/components/schemas/Counts'
    StudentAnalytics:
      type: object
      required:
      - courseId
      - studentId
      - snapshot
      - averageScore10
      - submissionRate
      - gradingRate
      - completionRate
      - pendingGradingRate
      - counts
      properties:
        courseId:
          type: integer
        studentId:
          type: integer
          description: Id del estudiante en Moodle.
        snapshot:
          $ref: '#/components/schemas/SnapshotMeta'
        averageScore10:
          $ref: '#/components/schemas/Metric'
        submissionRate:
          $ref: '#/components/schemas/Metric'
        gradingRate:
          $ref: '#/components/schemas/Metric'
        completionRate:
          $ref: '#/components/schemas/Metric'
        pendingGradingRate:
          $ref: '#/components/schemas/Metric'
        counts:
          $ref: '#/components/schemas/Counts'
    AlertEvidence:
      type: object
      required:
      - metric
      - explanation
      properties:
        metric:
          type: string
          enum: [averageScore10, submissionRate, gradingRate, completionRate, pendingGradingRate]
        observedValue:
          type: number
          nullable: true
        threshold:
          type: number
          nullable: true
        numerator:
          type: integer
          nullable: true
        denominator:
          type: integer
          nullable: true
        sourceIds:
          type: array
          items:
            type: string
        explanation:
          type: string
    Alert:
      type: object
      required:
      - alertId
      - ruleCode
      - courseId
      - severity
      - status
      - detectedAt
      - evidence
      properties:
        alertId:
          type: string
        ruleCode:
          type: string
          enum: [LOW_AVERAGE, LOW_SUBMISSION, PENDING_GRADING, LOW_COMPLETION, NO_DATA]
        courseId:
          type: integer
        studentId:
          type: integer
          nullable: true
        severity:
          type: string
          enum: [info, warning, critical]
        status:
          type: string
          enum: [active, resolved]
        detectedAt:
          type: string
          format: date-time
        resolvedAt:
          type: string
          format: date-time
          nullable: true
        evidence:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/AlertEvidence'
    PageOfAlerts:
      type: object
      required: [items, page, pageSize, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Alert'
        page:
          type: integer
        pageSize:
          type: integer
        total:
          type: integer
    CourseReportData:
      type: object
      required:
      - courseId
      - snapshot
      - metrics
      - findings
      properties:
        courseId:
          type: integer
        snapshot:
          $ref: '#/components/schemas/SnapshotMeta'
        periodStart:
          type: string
          format: date-time
          nullable: true
        periodEnd:
          type: string
          format: date-time
          nullable: true
        metrics:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/Metric'
        findings:
          type: array
          description: Hallazgos estructurados para conservar la trazabilidad de la alerta o métrica de origen.
          items:
            $ref: '#/components/schemas/ReportFinding'
        activeAlertCount:
          type: integer
          minimum: 0
    ReportFinding:
      type: object
      required: [text]
      properties:
        alertId:
          type: string
          nullable: true
        ruleCode:
          type: string
          nullable: true
        studentId:
          type: integer
          nullable: true
        metric:
          type: string
          nullable: true
          enum: [averageScore10, submissionRate, gradingRate, completionRate, pendingGradingRate]
        text:
          type: string
    Problem:
      type: object
      required: [title, status, code]
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        code:
          type: string
          enum:
          - TOKEN_INVALID
          - TOKEN_EXPIRED
          - COURSE_NOT_AUTHORIZED
          - COURSE_NOT_FOUND
          - STUDENT_NOT_FOUND
          - DATA_NOT_AVAILABLE
          - MOODLE_UNAVAILABLE
          - VALIDATION_ERROR
        traceId:
          type: string
    PageParameter:
      type: integer
      minimum: 1
      default: 1
    PageSizeParameter:
      type: integer
      minimum: 1
      maximum: 200
      default: 50
  parameters:
    courseId:
      name: courseId
      in: path
      required: true
      schema:
        type: integer
      description: Id del curso en Moodle.
    studentId:
      name: studentId
      in: path
      required: true
      schema:
        type: integer
      description: Id del estudiante en Moodle.
    studentIdQuery:
      name: studentId
      in: query
      schema:
        type: integer
    snapshotId:
      name: snapshotId
      in: query
      schema:
        type: string
      description: Snapshot específico; si se omite se usa la última sincronización exitosa. El MVP no expone una ruta para listar snapshots.
    severity:
      name: severity
      in: query
      schema:
        type: string
        enum: [info, warning, critical]
    alertStatus:
      name: status
      in: query
      schema:
        type: string
        enum: [active, resolved]
        default: active
      description: Estado de la alerta; por defecto solo se devuelven alertas activas.
    page:
      name: page
      in: query
      schema:
        $ref: '#/components/schemas/PageParameter'
    pageSize:
      name: pageSize
      in: query
      schema:
        $ref: '#/components/schemas/PageSizeParameter'
    requestId:
      name: X-Request-Id
      in: header
      schema:
        type: string
      description: Identificador distribuido; se devuelve en errores y se propaga al servicio.
  responses:
    BadRequest:
      description: Parámetro de consulta inválido (por ejemplo page, pageSize, severity, status o snapshotId).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthorized:
      description: Token ausente, inválido o vencido.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: El docente no tiene acceso al curso.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: Curso o estudiante inexistente.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unavailable:
      description: El origen de datos o un servicio interno no está disponible.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT reenviado por el api-gateway; el gateway valida autorización por curso y analytics valida que el token sea válido.
