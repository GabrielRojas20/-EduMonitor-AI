services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: edumonitor-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Define MSSQL_SA_PASSWORD en .env}
    ports:
      - "${MSSQL_PORT:-1433}:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -C -Q \"SELECT 1\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  analytics-db-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: edumonitor-analytics-db-init
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
    volumes:
      - ./services/analytics-service/database.sql:/scripts/database.sql:ro
    entrypoint: ["/bin/bash", "-c"]
    command: ["/opt/mssql-tools18/bin/sqlcmd -S sqlserver,1433 -U sa -P \"$${MSSQL_SA_PASSWORD}\" -C -i /scripts/database.sql"]

  ollama:
    image: ollama/ollama:latest
    container_name: edumonitor-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama

  analytics:
    build:
      context: ./services/analytics-service
      dockerfile: Dockerfile
    container_name: edumonitor-analytics
    depends_on:
      analytics-db-init:
        condition: service_completed_successfully
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:5003
      ConnectionStrings__EduMonitor: "Server=sqlserver,1433;Database=EduMonitor;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True;"
    ports:
      - "5003:5003"

  api-gateway:
    build:
      context: ./services/api-gateway
      dockerfile: Dockerfile
    container_name: edumonitor-api-gateway
    ports:
      - "5000:5000"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:5000
      - ReverseProxy__Clusters__auth-cluster__Destinations__auth-destination__Address=http://auth-courses:5001
      - ReverseProxy__Clusters__sync-cluster__Destinations__sync-destination__Address=http://moodle-sync:5002
      - ReverseProxy__Clusters__analytics-cluster__Destinations__analytics-destination__Address=http://analytics:5003
      - JWT_SECRET=${JWT_SECRET}
      - JWT_ISSUER=${JWT_ISSUER}
      - JWT_AUDIENCE=${JWT_AUDIENCE}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS}
    depends_on:
      - auth-courses
      - moodle-sync
      - analytics

  auth-courses:
    build:
      context: ./services/auth-courses-service
      dockerfile: Dockerfile
    container_name: edumonitor-auth-courses
    ports:
      - "5001:5001"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:5001
      - ConnectionStrings__Auth=${ConnectionStrings__Auth}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_ISSUER=${JWT_ISSUER}
      - JWT_AUDIENCE=${JWT_AUDIENCE}
      - JWT_EXPIRES_MINUTES=${JWT_EXPIRES_MINUTES}
      - AUTH_SEED_PASSWORD=${AUTH_SEED_PASSWORD}
    depends_on:
      sqlserver:
        condition: service_healthy

  moodle-sync:
    build:
      context: ./services/moodle-sync-service
      dockerfile: Dockerfile
    container_name: edumonitor-moodle-sync
    ports:
      - "5002:5002"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:5002
      - ConnectionStrings__EduMonitor=Server=sqlserver,1433;Database=EduMonitor;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True;
      - MOODLE_BASE_URL=${MOODLE_BASE_URL}
      - MOODLE_WS_TOKEN=${MOODLE_WS_TOKEN}
      - MOODLE_WS_SERVICE=${MOODLE_WS_SERVICE}
    depends_on:
      sqlserver:
        condition: service_healthy
      analytics-db-init:
        condition: service_completed_successfully

volumes:
  sqlserver-data:
  ollama-data:
